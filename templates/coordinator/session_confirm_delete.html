{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
  <h3>Delete session?</h3>
  <p>Delete <strong>{{ object }}</strong>? Its room requirements and assignments will also be removed.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'manage:session_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
