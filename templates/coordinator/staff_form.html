{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
  <h3>{% if object %}Edit{% else %}Add{% endif %} Staff Member</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'manage:staff_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
