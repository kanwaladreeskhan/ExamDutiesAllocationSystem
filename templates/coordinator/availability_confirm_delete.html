{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
  <h3>Delete entry?</h3>
  <p>Delete <strong>{{ object }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'manage:availability_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
