{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
  <h3>{% if object %}Edit{% else %}Add{% endif %} Availability</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <p class="text-muted small">Leave times empty to cover the whole day. Untick "Is available" to mark the staff member unavailable.</p>
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'manage:availability_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
