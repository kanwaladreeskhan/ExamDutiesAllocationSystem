{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h3>Rooms</h3>
    <a href="{% url 'manage:room_add' %}" class="btn btn-primary">Add Room</a>
  </div>
  <table class="table table-striped bg-white">
    <thead><tr><th>Name</th><th>Capacity</th><th></th></tr></thead>
    <tbody>
    {% for room in object_list %}
      <tr>
        <td>{{ room.name }}</td>
        <td>{{ room.capacity }}</td>
        <td>
          <a href="{% url 'manage:room_edit' room.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{% url 'manage:room_delete' room.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No rooms yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
