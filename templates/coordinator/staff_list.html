{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h3>Staff</h3>
    <a href="{% url 'manage:staff_add' %}" class="btn btn-primary">Add Staff</a>
  </div>
  <table class="table table-striped bg-white">
    <thead><tr><th>Name</th><th>Username</th><th>Designation</th><th>Max duties</th><th></th></tr></thead>
    <tbody>
    {% for p in object_list %}
      <tr>
        <td>{{ p.user.get_full_name }}</td>
        <td>{{ p.user.username }}</td>
        <td>{{ p.designation }}</td>
        <td>{{ p.max_duties }}</td>
        <td>
          <a href="{% url 'manage:staff_edit' p.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{% url 'manage:staff_delete' p.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No staff yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
