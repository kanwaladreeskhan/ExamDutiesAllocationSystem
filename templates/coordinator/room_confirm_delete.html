{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:500px;">
  <h3>Delete room?</h3>
  <p>Are you sure you want to delete <strong>{{ object.name }}</strong>? Its session links will also be removed.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'manage:room_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
